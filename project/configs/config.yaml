data:
  raw_path: "data/credit_risk_dataset.csv"
  processed_path: "data/processed_dataset.csv"
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  target_column: "loan_status"

features:
  numeric:
    - person_age
    - person_income
    - person_emp_length
    - loan_amnt
    - loan_int_rate
    - loan_percent_income
    - cb_person_cred_hist_length
  categorical:
    - person_home_ownership
    - loan_intent
    - loan_grade
    - cb_person_default_on_file

training:
  random_state: 42
  cv_folds: 5

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42

  catboost:
    iterations: 500
    learning_rate: 0.05
    depth: 6
    l2_leaf_reg: 3
    class_weights: [1, 3]
    random_seed: 42
    verbose: 0

artifacts:
  model_path: "artifacts/model.pkl"
  preprocessor_path: "artifacts/preprocessor.pkl"
  metrics_path: "artifacts/metrics.json"

service:
  host: "0.0.0.0"
  port: 5000
  log_level: "info"
